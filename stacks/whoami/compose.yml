# ==================================================================
# OrganicServer — stack pilota whoami (dual-stack)
#
# Servizio HTTP minimale per validare la rete edge (dual-stack) e il
# baseline hardened. Derivato da stacks/_template/compose.yml.
#
# Nessuna porta pubblicata sull'host: il container è raggiungibile solo
# sulla rete edge agli indirizzi statici 172.20.0.20 / fd00:dead:beef:20::20.
# ==================================================================

name: whoami

services:
  whoami:
    # Tag immutabile e verificabile; mai tag flottanti.
    image: traefik/whoami:v1.10.3

    # Immagine scratch eseguita con UID/GID non privilegiati.
    user: "65534:65534"

    # Porta non privilegiata: con cap_drop: ALL il bind su porta <1024
    # fallirebbe. whoami ascolta su tutte le interfacce del container.
    command:
      - "--port=8080"
      - "--name=whoami"

    # --- Mandatory hardening: do not remove -------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /run:noexec,nosuid,size=16m
    # ----------------------------------------------------------------

    restart: unless-stopped

    # Nessun segreto richiesto dal pilota. Il file resta opzionale per
    # consentire la validazione anche senza secrets montati.
    env_file:
      - path: /etc/organic-server/secrets/whoami.env
        required: false

    # Solo edge: indirizzi deterministici nel range degli edge services
    # (.20 / ::20), registrati in .ai/CONTEXT.md.
    networks:
      edge:
        ipv4_address: "172.20.0.20"
        ipv6_address: "fd00:dead:beef:20::20"

    expose:
      - "8080"

    # traefik/whoami è un'immagine scratch: non contiene shell, curl o
    # wget, quindi un healthcheck exec fallirebbe sempre. L'endpoint
    # /health viene interrogato dall'esterno (RUNBOOK §3.4); il controllo
    # Docker è disabilitato esplicitamente invece di dichiarare un test
    # che non può essere eseguito.
    healthcheck:
      disable: true

networks:
  edge:
    external: true
    name: edge
