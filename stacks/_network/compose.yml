# OrganicServer - shared dual-stack Docker networks (IPv4 + IPv6).
#
# Declarative source of truth for the networks described in .ai/NETWORK.md:
#   edge      routed/exposed frontend network (dual-stack)
#   internal  isolated backend network (dual-stack, internal: true)
#
# IPv6 subnets are ULA examples inside fd00::/8 (RFC 4193); IPv4 subnets are
# RFC 1918 examples. Record the real values in .ai/CONTEXT.md after the
# networks are created on the host.
#
# NOTE: the `edge` IPv6 prefix is a ULA example so the template stays
# self-contained. To expose services with native routing, replace it with a
# slice of the provider-delegated prefix (see .ai/NETWORK.md) before applying.
#
# Applying this file creates host-level Docker networks and is Tier 2:
# validate first with `docker compose -f stacks/_network/compose.yml config`.

name: organic-networks

# Compose drops top-level networks that no service references. This anchor
# keeps the project model complete without running a real workload: it runs
# `alpine true` once and exits immediately. `docker compose up` creates the
# two networks and the anchor container exits cleanly (exit 0).
services:
  network-anchor:
    image: alpine:3.20.3
    command: ["true"]
    restart: "no"
    networks:
      - edge
      - internal

networks:
  edge:
    name: edge
    driver: bridge
    enable_ipv6: true
    internal: false
    ipam:
      driver: default
      config:
        - subnet: "172.20.0.0/24"
          gateway: "172.20.0.1"
        - subnet: "fd00:dead:beef:20::/64"
          gateway: "fd00:dead:beef:20::1"
    driver_opts:
      com.docker.network.bridge.name: "br-edge"
      # IPv4 (private range) egress uses Docker NAT; IPv6 is routed natively
      # (no NAT66). Leave IPv4 masquerade enabled for outbound connectivity.
      com.docker.network.bridge.enable_ip_masquerade: "true"

  internal:
    name: internal
    driver: bridge
    enable_ipv6: true
    internal: true
    ipam:
      driver: default
      config:
        - subnet: "172.30.0.0/24"
          gateway: "172.30.0.1"
        - subnet: "fd00:dead:beef:30::/64"
          gateway: "fd00:dead:beef:30::1"
    driver_opts:
      com.docker.network.bridge.name: "br-internal"
