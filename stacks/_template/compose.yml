# ==================================================================
# OrganicServer — hardened IPv6-only stack blueprint
#
# Copy this directory to stacks/<service>/ and read README.md before
# changing anything. The service below is a placeholder: it exists to
# show the mandatory security baseline, not to be deployed as-is.
#
# Validate with:
#   docker compose -f stacks/<service>/compose.yml config
#
# Networks are created once by stacks/_network/compose.yml and are
# always referenced as external. Never redefine them here.
# ==================================================================

name: organic-template

services:
  example-app:
    # Pin an exact version tag, or better an immutable digest
    # (image@sha256:...). Floating tags such as :latest are forbidden.
    image: alpine:3.20.3

    # Never run as root. Use the UID/GID that owns the persistent data
    # (PUID/PGID in .env.example, default 1000:1000).
    user: "1000:1000"

    # Placeholder workload: serves a static page on an unprivileged port.
    # Replace the image and command with the real service.
    command:
      - sh
      - -c
      - |
        printf 'ok\n' > /tmp/index.html
        exec httpd -f -p 8080 -h /tmp

    # --- Mandatory hardening: do not remove -------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /run:noexec,nosuid,size=16m
    # ----------------------------------------------------------------

    restart: unless-stopped

    # Secrets and non-sensitive runtime settings live outside the repo.
    # required: false keeps `docker compose config` usable on machines
    # where the secrets directory is not mounted yet.
    env_file:
      - path: /etc/organic-server/secrets/example-app.env
        required: false

    # Deterministic IPv6 address on the network that matches the role.
    #   internal-v6: backend/database, host IDs ::10 upward
    #   edge-v6:     reverse proxy/edge only, host IDs ::20 upward
    # Never attach a backend service to edge-v6. Record the address in
    # .ai/CONTEXT.md before the first deploy.
    networks:
      internal-v6:
        ipv6_address: "fd00:dead:beef:30::10"

    # Internal only: no host port publishing. Only the reverse proxy may
    # publish on edge-v6, and only with an IPv6 host binding.
    # Internal services are reached at http://[<ipv6_address>]:8080.
    expose:
      - "8080"

    # Probe over IPv6 loopback, never over IPv4 loopback.
    # Replace with the real readiness endpoint of the service.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://[::1]:8080/' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge-v6:
    external: true
    name: edge-v6
  internal-v6:
    external: true
    name: internal-v6
